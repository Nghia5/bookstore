name: Bookstore CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/src/Bookstore.API/Bookstore.API.csproj

      - name: Build Backend Solution
        run: dotnet build backend/src/Bookstore.API/Bookstore.API.csproj -c Release --no-restore

      - name: Restore Test Dependencies
        run: dotnet restore backend/tests/Bookstore.Tests/Bookstore.Tests.csproj

      - name: Run Backend Automated Unit Tests (xUnit)
        run: dotnet test backend/tests/Bookstore.Tests/Bookstore.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint and Build Frontend Vite SPA
        working-directory: ./frontend
        run: npm run build

      - name: Trigger Render Deploy Hook (If Configured)
        if: github.ref == 'refs/heads/main' && success() && env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Calling Render Deploy Hook after CI success..."
          curl -X POST "$RENDER_DEPLOY_HOOK"
