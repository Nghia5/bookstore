services:
  # 1. Backend Web Service (.NET 10 API Docker)
  - type: web
    name: bookstore-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
    healthCheckPath: /health

  # 2. Frontend Static Site (100% Free CDN, SPA Client-Side Routing)
  - type: static
    name: bookstore-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bookstore-backend
          property: url
